[project]
name = "lol-airflow-local"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "apache-airflow==2.10.5",
    "apache-airflow-providers-google>=12,<13",
    # Matches the official Airflow 2.10.5 constraint set. The Google provider
    # imports its lineage facets at DAG parse time.
    "openlineage-python==1.27.0",
    "psycopg2-binary>=2.9,<3",
]

[tool.uv]
package = false
